<section class="testimonials-panel" id="smsTestimonials" aria-labelledby="smsTestimonialsTitle">
  <div class="testimonials-head">
    <div>
      <p class="testimonials-kicker">Voices from the journey</p>
      <h2 id="smsTestimonialsTitle">Public testimonials</h2>
      <p class="testimonials-copy">
        Real feedback from seekers who chose to share their experience publicly.
      </p>
    </div>
    <div class="testimonials-stats">
      <article class="testimonial-stat">
        <span class="testimonial-stat__label">Average rating</span>
        <strong id="smsTestimonialsAverage">—</strong>
      </article>
      <article class="testimonial-stat">
        <span class="testimonial-stat__label">Public reviews</span>
        <strong id="smsTestimonialsCount">—</strong>
      </article>
    </div>
  </div>

  <div class="testimonials-breakdown" id="smsTestimonialsBreakdown" aria-label="Rating breakdown"></div>

  <div class="testimonials-track" id="smsTestimonialsTrack">
    <article class="testimonial-card testimonial-card--placeholder">
      <div class="testimonial-card__stars">★★★★★</div>
      <h3>Loading testimonials…</h3>
      <p>Fetching approved voices from the community.</p>
    </article>
  </div>
</section>
