<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b142b;color:#f5f7ff;font-family:system-ui,sans-serif;padding:16px}
    .card{width:100%;max-width:380px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:24px}
    h1{font-size:1.3rem;margin:0 0 16px}
    label{display:block;margin:12px 0 4px;font-size:.9rem}
    input{width:100%;box-sizing:border-box;padding:.7rem;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:inherit}
    button{margin-top:18px;width:100%;padding:.8rem;border:0;border-radius:10px;font-weight:600;background:linear-gradient(90deg,#9ad1ff,#bfdfff);color:#0b142b;cursor:pointer}
    .err{color:#ffb3b3;margin-top:12px}
    a{color:#9ad1ff}
  </style>
</head>
<body>
  <main class="card">
    {% if valid %}
      <h1>Choose a new password</h1>
      <form method="post">
        {% csrf_token %}
        <label for="np">New password</label>
        <input id="np" name="new_password" type="password" required autocomplete="new-password">
        <label for="cp">Confirm new password</label>
        <input id="cp" name="confirm_password" type="password" required autocomplete="new-password">
        {% if error %}<p class="err">{{ error }}</p>{% endif %}
        <button type="submit">Update password</button>
      </form>
    {% else %}
      <h1>Link expired or invalid</h1>
      <p>This reset link is no longer valid. <a href="/login/?mode=forgot">Request a new one</a>.</p>
    {% endif %}
  </main>
</body>
</html>
