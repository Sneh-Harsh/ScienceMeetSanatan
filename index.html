<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <video class="video-background" autoplay muted loop playsinline>
      <source src="assets/background-video.mp4" type="video/mp4" />
      Your browser does not support the background video.
    </video>

    <button id="toggleLogin" class="toggle-login-btn" type="button" aria-pressed="false">
      Hide Login
    </button>

    <h2 id="brandTitle" class="brand-title">Science Meet Sanatan</h2>

    <main class="login-wrapper">
      <section class="login-card" aria-label="Login form">
        <h1>Welcome Back</h1>
        <form class="login-form" action="#" method="post">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter your username" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />

          <button type="submit" class="primary-btn">Log In</button>
        </form>

        <div class="divider" aria-hidden="true"><span>or continue with</span></div>

        <div class="social-buttons">
          <button type="button" class="social-btn">Google</button>
          <button type="button" class="social-btn">Apple ID</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
